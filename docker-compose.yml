services:

  database:
    build:
      context: ./database
    env_file:
      - .idea/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend/simpleapi
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - frontend-network
      - backend-network
    depends_on:
      database:
        condition: service_healthy

  httpd:
    build:
      context: ./httpd
    ports:
      - "80:80"
    networks:
      - frontend-network
    depends_on:
      - backend

networks:
  frontend-network:
  backend-network:

volumes:
  postgres-data: