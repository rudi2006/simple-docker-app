
  name: CI devops 2025

  on:
    push:
      branches:
        - master
        - develop
    pull_request:

  permissions:
    contents: read

  jobs:
    # 1. Test the backend
    test-backend:
      name: Test backend
      runs-on: ubuntu-24.04

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        - name: Build and test with Maven
          run: mvn clean verify --file ./backend/simpleapi/pom.xml

    # 2. Build and publish the backend image
    build-backend:
      name: Build and push backend image
      needs: test-backend
      runs-on: ubuntu-24.04

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          if: github.event_name == 'push' && github.ref == 'refs/heads/master'
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push backend
          uses: docker/build-push-action@v6
          with:
            context: ./backend/simpleapi
            push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            tags: |
              rudi2020/simpleapi:latest
              rudi2020/simpleapi:${{ github.sha }}

    # 3. Build and publish the database image
    build-database:
      name: Build and push database image
      needs: test-backend
      runs-on: ubuntu-24.04

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          if: github.event_name == 'push' && github.ref == 'refs/heads/master'
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push database
          uses: docker/build-push-action@v6
          with:
            context: ./database
            push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            tags: |
              rudi2020/database:latest
              rudi2020/database:${{ github.sha }}

    # 4. Build and publish the HTTPD reverse proxy image
    build-httpd:
      name: Build and push HTTPD image
      needs: test-backend
      runs-on: ubuntu-24.04

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          if: github.event_name == 'push' && github.ref == 'refs/heads/master'
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push HTTPD
          uses: docker/build-push-action@v6
          with:
            context: ./httpd
            push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            tags: |
              rudi2020/httpd:latest
              rudi2020/httpd:${{ github.sha }}

    # 5. Build and publish the frontend image
    build-frontend:
      name: Build and push frontend image
      needs: test-backend
      runs-on: ubuntu-24.04

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          if: github.event_name == 'push' && github.ref == 'refs/heads/master'
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push frontend
          uses: docker/build-push-action@v6
          with:
            context: ./frontend
            push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            tags: |
              rudi2020/frontend:latest
              rudi2020/frontend:${{ github.sha }}

    # 6. Deploy to the remote server
    deploy:
      name: Deploy to remote server
      needs:
        - build-backend
        - build-database
        - build-httpd
        - build-frontend
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      runs-on: ubuntu-24.04

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install Ansible
          run: |
            python -m pip install ansible-core==2.16.3
            ansible-galaxy collection install community.docker:5.4.0

        - name: Configure SSH
          env:
            SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          run: |
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/takima_key
            chmod 600 ~/.ssh/takima_key
            ssh-keyscan -H kadjio.mballa.takima.school >> ~/.ssh/known_hosts

        - name: Deploy application with Ansible
          run: |
            ansible-playbook \
              -i ansible/inventories/setup.yml \
              ansible/playbook.yml \
              --private-key ~/.ssh/takima_key
    
